[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-site-qa-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-playwright>=0.7,<1", "ruff>=0.11,<1"]

[project.scripts]
retail-qa = "retail_qa.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires an installed Playwright browser"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

